[project]
name = "heat-control"
version = "0.1.0"
description = "Electric heater control through Home Assistant (hassapi, numpy, control)"
readme = "README.md"
authors = [
    { name = "Robin", email = "robin@trioux.eu" }
]
requires-python = ">=3.12"
dependencies = [
    "control>=0.10.2",
    "hassapi>=0.3.0",
    "numpy>=2.5.4",
    "slycot>=0.7.1",
]

[project.scripts]
heat-control = "heat_control:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"
